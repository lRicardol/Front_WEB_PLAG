name: OWASP Dependency-Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1'   # cada lunes, para detectar CVE nuevos
  workflow_dispatch:

env:
  DC_VERSION: 13.0.0

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Compute cache date
        id: date
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore NVD database
        uses: actions/cache/restore@v6
        with:
          path: ~/.dependency-check-data
          key: ${{ runner.os }}-nvd-${{ steps.date.outputs.today }}
          restore-keys: ${{ runner.os }}-nvd-

      - name: Download Dependency-Check CLI
        run: |
          curl -sSL -o dc.zip "https://github.com/dependency-check/DependencyCheck/releases/download/v${DC_VERSION}/dependency-check-${DC_VERSION}-release.zip"
          unzip -q dc.zip

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mkdir -p reports
          ./dependency-check/bin/dependency-check.sh \
            --project "Front_WEB_PLAG" \
            --scan . \
            --exclude "**/node_modules/**" \
            --exclude "**/dependency-check/**" \
            --exclude "**/dist/**" \
            --exclude "**/coverage/**" \
            --format HTML --format SARIF \
            --out reports \
            --failOnCVSS 7 \
            --nvdApiKey "$NVD_API_KEY" \
            --data ~/.dependency-check-data \
            --disableOssIndex \
            --disableYarnAudit \
            --disablePnpmAudit

      - name: Save NVD database
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.dependency-check-data
          key: ${{ runner.os }}-nvd-${{ steps.date.outputs.today }}

      - name: Upload SARIF to GitHub Security
        if: always() && hashFiles('reports/dependency-check-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/dependency-check-report.sarif
          category: dependency-check

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: reports/dependency-check-report.html